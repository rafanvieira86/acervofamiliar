<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Acervo — Consulta e Registro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><strong>Meu Acervo</strong><span>Acervo pessoal</span></div>
      <nav>
        <button class="nav-item active" data-view="inicio">Início</button>
        <button class="nav-item" data-view="itens">Acervo</button>
        <button class="nav-item" data-view="pessoas">Pessoas</button>
        <button class="nav-item" data-view="categorias">Categorias</button>
        <button class="nav-item" data-view="locais">Localização física</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="config">Configurações</button>
        <div class="storage">Armazenamento local<br><b id="storageCount">0 itens</b></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mobile-title">Meu Acervo</div>
        <div class="search"><input id="globalSearch" placeholder="Pesquisar no acervo por título, pessoa, categoria, data..." /></div>
        <button class="primary" id="openAdd">Adicionar ao acervo</button>
      </header>

      <section id="appContent" class="content"></section>
    </main>
  </div>

  <div class="modal hidden" id="itemModal">
    <div class="modal-card">
      <div class="modal-head"><h2>Adicionar ao acervo</h2><button class="close" id="closeModal">×</button></div>
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <div class="form-grid">
          <label>Título *<input id="title" required placeholder="Ex.: Certidão de nascimento"></label>
          <label>Tipo
            <select id="type"><option>Documento</option><option>Fotografia</option><option>Vídeo</option><option>Áudio</option><option>Registro</option><option>Outro</option></select>
          </label>
          <label>Pessoa relacionada<input id="person" placeholder="Ex.: Rafael"></label>
          <label>Categoria<select id="category"></select></label>
          <label>Data<input id="date" type="date"></label>
          <label>Local<input id="place" placeholder="Ex.: Rio de Janeiro"></label>
          <label>Localização física<input id="physical" placeholder="Ex.: Caixa 01 / Pasta 03"></label>
          <label>Palavras-chave<input id="keywords" placeholder="família, nascimento, 1990"></label>
        </div>
        <label>Descrição<textarea id="description" rows="4" placeholder="Descreva o conteúdo, contexto ou importância do item."></textarea></label>
        <label>Observações<textarea id="notes" rows="3" placeholder="Observações adicionais"></textarea></label>
        
        <div class="filebox">
          <label>Arquivo digital <small id="fileLabel">(Opcional — armazenado nesta versão no navegador)</small></label>
          <input id="file" type="file">
        </div>
        
        <div class="form-actions" style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
          <button type="button" class="secondary" id="cancelModal">Cancelar</button>
          <button class="primary" type="submit">Salvar item</button>
        </div>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
